name: Self-update

on:
  schedule:
    - cron: "30 0 * * *"     # daily 06:00 IST: Unstop refresh; a full Claude check when the last one is 10+ days old
  workflow_dispatch:
    inputs:
      mode:
        description: "full = Claude re-check, unstop = open list only"
        default: full
        type: choice
        options: [full, unstop]

permissions:
  contents: write

concurrency:
  group: self-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev || npm install --no-audit --no-fund
      - name: Run the updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/update.mjs --auto | tee update-log.txt
          elif [ "${{ inputs.mode }}" = "unstop" ]; then
            node scripts/update.mjs --unstop-only
          else
            node scripts/update.mjs | tee update-log.txt
          fi
      - name: Commit changes
        run: |
          git config user.name "case-comp-updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- data.js live.js updates.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto update $(date +%F)" -m "$(tail -40 update-log.txt 2>/dev/null || echo 'Unstop open list refreshed')"
          git push
